<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moda İskelesi Vapur Kafe</title>
<meta name="description" content="Kadıköy Moda İskelesi'ndeki Vapur Kafe'nin tanıtım sayfası.">
<style>
  :root {
    --gece: #0B0E14;
    --gece-2: #11151D;
    --yuzey: rgba(255,255,255,.045);
    --cizgi: rgba(255,255,255,.09);
    --yazi: #F3EFE9;
    --soluk: #9CA3AB;
    --baca: #E3A62A;
    --kehribar: #8A5A3A;
    --deniz: #1F6F78;
    --liman: #10303F;
    --kagit: #F6F3EE;
    --girdi: #ECE8E1;
    --gutter: clamp(16px, 5vw, 40px);
    --sans: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.7;
    color: var(--yazi);
    background:
      radial-gradient(60% 38% at 50% 0%, rgba(176,112,64,.55) 0%, rgba(138,90,58,.22) 45%, transparent 75%),
      radial-gradient(50% 30% at 0% 100%, rgba(138,90,58,.45) 0%, transparent 70%),
      radial-gradient(50% 30% at 100% 100%, rgba(138,90,58,.35) 0%, transparent 70%),
      var(--gece);
    background-repeat: no-repeat;
    min-height: 100vh;
  }
  .sarmal { width: min(100% - 2 * var(--gutter), 68rem); margin-inline: auto; }

  /* Menü çubuğu */
  .cubuk {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px;
    padding: 8px 8px 8px 20px;
    background: rgba(18,21,29,.72);
    border: 1px solid var(--cizgi);
    border-radius: 16px;
    backdrop-filter: blur(10px);
  }
  .marka { font-weight: 600; letter-spacing: -0.01em; font-size: 1.02rem; }
  .cubuk .dugme { padding: 9px 18px; font-size: .9rem; }

  /* Düğmeler */
  .dugme {
    display: inline-block;
    font: inherit; font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: 0;
    border-radius: 12px;
    padding: 14px 26px;
    color: #1d1400;
    background: var(--baca);
    box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 8px 20px -8px rgba(227,166,42,.55);
    transition: transform .18s cubic-bezier(.3,1.5,.5,1), opacity .18s;
  }
  .dugme:hover { transform: translateY(-2px); }
  .dugme:active { transform: translateY(0) scale(.98); }
  .dugme:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* Üst bölüm */
  .ust { text-align: center; padding: clamp(72px, 16vw, 148px) 0 clamp(64px, 12vw, 112px); }
  h1 {
    font-weight: 300;
    font-size: clamp(2.2rem, 7.2vw, 4.2rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 auto clamp(28px, 5vw, 40px);
    max-width: 15em;
  }
  .ust .dugme { padding: 15px 30px; }

  /* Maddeler */
  .maddeler { display: grid; gap: 16px; }
  .kart {
    background: var(--yuzey);
    border: 1px solid var(--cizgi);
    border-radius: 20px;
    padding: clamp(22px, 4vw, 32px);
    box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 24px 48px -28px rgba(0,0,0,.7);
  }
  h2 { font-weight: 400; font-size: clamp(1.3rem, 3.6vw, 1.6rem); letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 10px; }
  .kart p { margin: 0; color: var(--soluk); max-width: 30em; }
  .kart a { color: var(--baca); text-underline-offset: 3px; border-radius: 4px; }
  .kart a:hover { color: #f3c55e; }
  .kart a:focus-visible { outline: 3px solid var(--baca); outline-offset: 3px; }

  /* İletişim */
  .iletisim { padding: clamp(64px, 12vw, 112px) 0 clamp(56px, 10vw, 96px); }
  .panel {
    display: grid;
    grid-template-columns: 1fr;
    background: var(--kagit);
    color: #14262E;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.08);
  }
  .sahne { position: relative; min-height: 200px; background: var(--liman); }
  .sahne svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vapur { animation: sal 7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes sal { from { transform: translateY(0) rotate(-.6deg); } to { transform: translateY(4px) rotate(.6deg); } }
  .form-alani { padding: clamp(24px, 5vw, 48px); }
  .form-alani h2 { color: var(--liman); font-weight: 600; font-size: clamp(1.5rem, 4vw, 1.9rem); margin-bottom: 2px; }
  .alt { margin: 0 0 22px; color: #4B6169; }
  form { display: grid; gap: 16px; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: .92rem; }
  .alan {
    font: inherit; font-weight: 400; color: #14262E;
    background: var(--girdi);
    border: 1.5px solid transparent;
    border-radius: 10px;
    padding: 12px 14px;
    width: 100%;
    transition: border-color .15s;
  }
  .alan::placeholder { color: #8b979b; }
  .alan:hover { border-color: #b9c4c7; }
  .alan:focus-visible { outline: 3px solid var(--deniz); outline-offset: 2px; border-color: var(--deniz); }
  textarea.alan { min-height: 7rem; resize: vertical; }
  .gonder { width: 100%; background: #000; color: #fff; box-shadow: 0 10px 24px -12px rgba(0,0,0,.7); }
  .gonder:focus-visible { outline-color: var(--deniz); }
  .durum { margin: 0; min-height: 1.7em; color: #4B6169; font-size: .92rem; }

  @media (min-width: 52rem) {
    .maddeler { grid-template-columns: 1fr 1fr; }
    .panel { grid-template-columns: 1fr 1fr; }
    .sahne { min-height: 560px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .vapur { animation: none; }
    .dugme { transition: none; }
  }
</style>
</head>
<body>

<div class="sarmal">
  <nav class="cubuk" aria-label="Ana">
    <span class="marka">Moda İskelesi Vapur Kafe</span>
    <a class="dugme" href="#iletisim">İletişim</a>
  </nav>
</div>

<header class="ust">
  <div class="sarmal">
    <h1>Moda İskelesi'nde vapuru beklerken uğranacak kafe.</h1>
    <a class="dugme" href="#iletisim">Bize yazın</a>
  </div>
</header>

<main>
  <section class="sarmal maddeler">
    <article class="kart">
      <h2>Ne yapıyor</h2>
      <p>Kadıköy'de, Moda İskelesi'nde bir kafe. Menüye <a href="https://files.sehirhatlari.istanbul/menu-tr.pdf" target="_blank" rel="noopener">buradan bakabilirsiniz</a>.</p>
    </article>
    <article class="kart">
      <h2>Kime yarıyor</h2>
      <p>Kadıköy'de yaşayanlara ve iskeleden geçenlere.</p>
    </article>
  </section>

  <section class="iletisim" id="iletisim">
    <div class="sarmal">
      <div class="panel">
        <div class="sahne" aria-hidden="true">
          <svg viewBox="0 0 400 560" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="gok" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#2a5a82"/>
                <stop offset=".55" stop-color="#e2a977"/>
                <stop offset="1" stop-color="#f5cf94"/>
              </linearGradient>
              <linearGradient id="deniz" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#2a7f86"/>
                <stop offset="1" stop-color="#0d2735"/>
              </linearGradient>
              <radialGradient id="gunes" cx=".5" cy=".5" r=".5">
                <stop offset="0" stop-color="#fff1c9" stop-opacity="1"/>
                <stop offset=".35" stop-color="#ffd48a" stop-opacity=".55"/>
                <stop offset="1" stop-color="#ffd48a" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <rect width="400" height="560" fill="url(#gok)"/>
            <circle cx="262" cy="318" r="120" fill="url(#gunes)"/>
            <circle cx="262" cy="326" r="34" fill="#fff0c4"/>
            <path d="M0 372 L0 352 C40 340 70 346 110 336 C150 326 190 344 230 338 C280 330 330 346 400 334 L400 372 Z" fill="#7a5a52" opacity=".55"/>
            <rect y="366" width="400" height="194" fill="url(#deniz)"/>
            <g stroke="#ffe7b0" stroke-linecap="round" opacity=".45">
              <path d="M236 384 H288" stroke-width="3"/>
              <path d="M222 396 H300" stroke-width="3"/>
              <path d="M240 410 H282" stroke-width="2.5"/>
              <path d="M228 426 H294" stroke-width="2"/>
            </g>
            <g class="vapur">
              <g transform="translate(86 306)">
                <rect x="86" y="-26" width="18" height="26" fill="#E3A62A"/>
                <rect x="86" y="-26" width="18" height="5" fill="#10202b"/>
                <rect x="52" y="0" width="86" height="18" rx="2" fill="#f1ece4"/>
                <rect x="26" y="18" width="140" height="24" rx="2" fill="#f1ece4"/>
                <g fill="#10303F" opacity=".75">
                  <rect x="60" y="6" width="8" height="6"/><rect x="76" y="6" width="8" height="6"/>
                  <rect x="108" y="6" width="8" height="6"/><rect x="124" y="6" width="8" height="6"/>
                  <rect x="36" y="25" width="9" height="7"/><rect x="54" y="25" width="9" height="7"/>
                  <rect x="72" y="25" width="9" height="7"/><rect x="90" y="25" width="9" height="7"/>
                  <rect x="108" y="25" width="9" height="7"/><rect x="126" y="25" width="9" height="7"/>
                  <rect x="144" y="25" width="9" height="7"/>
                </g>
                <path d="M0 42 H194 L174 62 H22 Z" fill="#0d1f2b"/>
                <rect x="14" y="42" width="166" height="4" fill="#E3A62A"/>
              </g>
            </g>
            <path d="M0 372 C50 366 90 378 140 372 S250 366 300 372 S370 378 400 372 V380 H0 Z" fill="#0d2735" opacity=".5"/>
            <rect x="0" y="470" width="400" height="90" fill="#0A2230" opacity=".35"/>
            <g fill="#2a1d14">
              <rect x="0" y="448" width="400" height="12"/>
              <rect x="30" y="460" width="8" height="100"/><rect x="120" y="460" width="8" height="100"/>
              <rect x="210" y="460" width="8" height="100"/><rect x="300" y="460" width="8" height="100"/>
              <rect x="380" y="460" width="8" height="100"/>
            </g>
          </svg>
        </div>

        <div class="form-alani">
          <h2>İletişim</h2>
          <p class="alt">Moda İskelesi Vapur Kafe</p>
          <form id="form" novalidate>
            <label>Ad
              <input class="alan" type="text" name="ad" autocomplete="name" placeholder="Adınız">
            </label>
            <label>Telefon
              <input class="alan" type="tel" name="telefon" autocomplete="tel" inputmode="tel" placeholder="05XX XXX XX XX">
            </label>
            <label>Kısa mesaj
              <textarea class="alan" name="mesaj" rows="4" placeholder="Mesajınız"></textarea>
            </label>
            <button class="dugme gonder" type="submit">Gönder</button>
            <p class="durum" id="durum" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('durum').textContent = 'Bu form henüz bir yere bağlı değil, mesajınız gönderilmedi.';
  });
</script>
</body>
</html>
